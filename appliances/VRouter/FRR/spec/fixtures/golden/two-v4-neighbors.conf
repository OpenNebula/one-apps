frr defaults traditional
hostname vr1
log syslog informational
service integrated-vtysh-config
route-map BGP-N0-IN permit 10
exit
route-map BGP-N0-OUT permit 10
exit
route-map BGP-N1-IN permit 10
exit
route-map BGP-N1-OUT permit 10
exit
router bgp 65010
 bgp router-id 10.99.37.2
 no bgp default ipv4-unicast
 neighbor 10.99.37.1 remote-as 65100
 neighbor 10.99.37.3 remote-as 65101
 address-family ipv4 unicast
  neighbor 10.99.37.1 activate
  neighbor 10.99.37.1 route-map BGP-N0-IN in
  neighbor 10.99.37.1 route-map BGP-N0-OUT out
  neighbor 10.99.37.3 activate
  neighbor 10.99.37.3 route-map BGP-N1-IN in
  neighbor 10.99.37.3 route-map BGP-N1-OUT out
 exit-address-family
exit
