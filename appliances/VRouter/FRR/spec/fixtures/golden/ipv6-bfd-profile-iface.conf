frr defaults traditional
hostname vr1
log syslog informational
service integrated-vtysh-config
route-map BGP-N0-IN permit 10
exit
route-map BGP-N0-OUT permit 10
exit
bfd
 profile BGP-N0
  detect-multiplier 5
  receive-interval 200
  transmit-interval 200
 exit
exit
router bgp 65010
 bgp router-id 10.99.37.2
 no bgp default ipv4-unicast
 neighbor fd77::21 remote-as 65002
 neighbor fd77::21 bfd
 neighbor fd77::21 bfd profile BGP-N0
 neighbor fd77::21 update-source eth1
 address-family ipv6 unicast
  neighbor fd77::21 activate
  neighbor fd77::21 route-map BGP-N0-IN in
  neighbor fd77::21 route-map BGP-N0-OUT out
 exit-address-family
exit
